<div class="badge" style="
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    background: {% if color == 'green' %}rgba(34,197,94,0.15){% elif color == 'red' %}rgba(239,68,68,0.15){% elif color == 'yellow' %}rgba(245,158,11,0.15){% elif color == 'blue' %}rgba(59,130,246,0.15){% else %}rgba(99,102,241,0.15){% endif %};
    color: {% if color == 'green' %}#4ade80{% elif color == 'red' %}#f87171{% elif color == 'yellow' %}#fbbf24{% elif color == 'blue' %}#60a5fa{% else %}#818cf8{% endif %};
    border: 1px solid {% if color == 'green' %}rgba(34,197,94,0.3){% elif color == 'red' %}rgba(239,68,68,0.3){% elif color == 'yellow' %}rgba(245,158,11,0.3){% elif color == 'blue' %}rgba(59,130,246,0.3){% else %}rgba(99,102,241,0.3){% endif %};
">{{ label }}</div>
