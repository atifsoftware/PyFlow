<div class="alert alert-{{ type }}" role="alert" style="
    padding: 12px 18px;
    border-radius: 10px;
    margin: 8px 0;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 10px;
    background: {% if type == 'success' %}rgba(34,197,94,0.12){% elif type == 'error' or type == 'danger' %}rgba(239,68,68,0.12){% elif type == 'warning' %}rgba(245,158,11,0.12){% else %}rgba(99,102,241,0.12){% endif %};
    border: 1px solid {% if type == 'success' %}rgba(34,197,94,0.3){% elif type == 'error' or type == 'danger' %}rgba(239,68,68,0.3){% elif type == 'warning' %}rgba(245,158,11,0.3){% else %}rgba(99,102,241,0.3){% endif %};
    color: {% if type == 'success' %}#4ade80{% elif type == 'error' or type == 'danger' %}#f87171{% elif type == 'warning' %}#fbbf24{% else %}#818cf8{% endif %};
">
    <span>{% if type == 'success' %}✅{% elif type == 'error' or type == 'danger' %}❌{% elif type == 'warning' %}⚠️{% else %}ℹ️{% endif %}</span>
    <span>{{ message }}</span>
</div>
