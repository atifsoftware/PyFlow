<div class="card" style="
    background: rgba(30,41,59,0.6);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 20px;
    padding: 24px 28px;
    margin-bottom: 16px;
">
    {% if title %}
    <div style="font-size: 1rem; font-weight: 700; color: #e2e8f0; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.06);">
        {{ title }}
    </div>
    {% endif %}
    <div class="card-body">
        {{ slot }}
    </div>
</div>
